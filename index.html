<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="직렬 회전관절 로봇팔의 정기구학과 작업공간을 살펴보는 3D 시뮬레이터" />
    <title>easyArm-sim</title>
  </head>
  <body>
    <header class="app-bar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">⟐</span><h1>easyArm-sim</h1></div>
      <span class="header-context">로봇팔 기구학 시뮬레이터</span>
      <span id="axis-count" class="axis-count"></span>
    </header>
    <main class="layout">
      <aside class="panel structure" aria-labelledby="structure-title">
        <div class="panel-heading">
          <h2 id="structure-title">팔 구조</h2>
          <button type="button" id="add-joint" class="secondary">+ 관절</button>
        </div>
        <div class="panel-scroll">
          <div id="joint-list" class="joint-list" aria-label="관절 선택"></div>
          <div id="joint-editor"></div>
          <section class="tool-section">
            <h3>공구 끝점 <span>TCP</span></h3>
            <label class="field">공구 길이 · 로컬 +Z
              <span class="input-unit"><input type="number" id="tool-length" min="0" max="10000" step="any" /><span>mm</span></span>
            </label>
            <p class="hint">마지막 링크 끝에서 적용합니다.</p>
          </section>
        </div>
      </aside>
      <section class="viewport" aria-label="3D 로봇팔 뷰">
        <div id="scene" class="scene"></div>
        <div class="view-top">
          <div class="view-label"><span class="live-dot"></span>3D 뷰 <span class="muted">Z-up</span></div>
          <button type="button" id="fit" class="secondary">전체 보기</button>
        </div>
        <div class="view-floor">
          <div class="view-strip">
            <div class="tcp" aria-label="베이스 기준 TCP 좌표">
              <div class="tcp-title">TCP <span>베이스 기준 · mm</span></div>
              <div class="tcp-values">
                <span><b class="x">X</b> <output id="tcp-x">0.0</output></span>
                <span><b class="y">Y</b> <output id="tcp-y">0.0</output></span>
                <span><b class="z">Z</b> <output id="tcp-z">0.0</output></span>
              </div>
            </div>
            <div class="mouse-guide">드래그 회전 · 휠 확대 · 우클릭 드래그 이동</div>
          </div>
          <div class="workspace">
            <div class="workspace-heading"><h2>작업공간</h2><output id="bound"></output></div>
            <div class="layers">
              <label><input type="checkbox" id="sphere" /> 도달 반경 상한</label>
              <label><input type="checkbox" id="points" /> TCP 점군</label>
              <label><input type="checkbox" id="frames" /> 관절 좌표계</label>
            </div>
            <p class="hint">격자 구는 첫 관절 기준 거리 상한입니다. 점군은 관절 한계 내 표본이며, 점이 드문 곳의 도달 여부는 판단할 수 없습니다.</p>
          </div>
        </div>
      </section>
      <aside class="panel control" aria-labelledby="jog-title">
        <div class="panel-heading"><h2 id="jog-title">관절 조작</h2><span class="muted">각도 · °</span></div>
        <div class="panel-scroll">
          <div id="jog"></div>
          <section class="poses">
            <h3>저장 자세</h3>
            <form id="save-form">
              <label for="pose-name" class="sr-only">자세 이름</label>
              <input id="pose-name" maxlength="40" placeholder="자세 이름" required />
              <button type="submit" class="secondary">저장</button>
            </form>
            <label for="pose-select" class="sr-only">저장 자세 선택</label>
            <select id="pose-select"></select>
            <div class="pose-actions">
              <button type="button" id="move" class="primary">MoveJ</button>
              <button type="button" id="delete-pose" class="secondary">삭제</button>
            </div>
            <p id="status" class="hint status" role="status"></p>
            <p id="storage-status" class="hint" role="status" hidden></p>
          </section>
        </div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
